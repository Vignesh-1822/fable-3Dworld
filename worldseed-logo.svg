<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Worldseed — procedural 3D world generator logo</title>
  <defs>
    <style>
      @keyframes spin  { from{transform:rotate(0deg)}   to{transform:rotate(360deg)} }
      @keyframes pulse { 0%,100%{opacity:0.15} 50%{opacity:0.4} }
      @keyframes rise  { 0%,100%{opacity:0.5}  50%{opacity:1} }
      .orb  { animation: spin  12s linear     infinite; transform-origin: 60px 60px; }
      .glow { animation: pulse  2.4s ease-in-out infinite; }
      .rise { animation: rise   2s ease-in-out  infinite; }
    </style>
    <linearGradient id="wsGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <radialGradient id="glowR" cx="50%" cy="50%">
      <stop offset="0%"   stop-color="white" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="120" height="120" rx="26" fill="url(#wsGrad)"/>

  <!-- Globe outline -->
  <circle cx="60" cy="60" r="44" fill="none" stroke="white" stroke-width="1.5" opacity="0.3"/>
  <circle cx="60" cy="60" r="44" fill="rgba(255,255,255,0.04)"/>

  <!-- Latitude lines -->
  <ellipse cx="60" cy="60" rx="44" ry="14" fill="none" stroke="white" stroke-width="0.8" opacity="0.25"/>
  <ellipse cx="60" cy="46" rx="38" ry="10" fill="none" stroke="white" stroke-width="0.8" opacity="0.2"/>
  <ellipse cx="60" cy="74" rx="38" ry="10" fill="none" stroke="white" stroke-width="0.8" opacity="0.2"/>

  <!-- Longitude line -->
  <line x1="60" y1="16" x2="60" y2="104" stroke="white" stroke-width="0.8" opacity="0.25"/>

  <!-- Terrain silhouette -->
  <path d="M20 60 Q28 48 36 55 Q40 43 48 50 Q52 38 60 45 Q68 34 76 42 Q82 46 88 40 Q94 47 100 60"
    fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Orbiting seed spark -->
  <g class="orb">
    <circle cx="60" cy="16" r="5" fill="#86efac"/>
    <circle cx="60" cy="16" r="3" fill="white"/>
  </g>

  <!-- Glow -->
  <circle cx="60" cy="60" r="20" fill="url(#glowR)" class="glow"/>

  <!-- Rising growth lines -->
  <path d="M55 80 Q53 70 58 62" fill="none" stroke="#86efac" stroke-width="1.5" stroke-linecap="round" class="rise" opacity="0.7"/>
  <path d="M60 82 Q60 72 60 63"  fill="none" stroke="#86efac" stroke-width="1.5" stroke-linecap="round" class="rise"/>
  <path d="M65 80 Q67 70 62 62" fill="none" stroke="#86efac" stroke-width="1.5" stroke-linecap="round" class="rise" opacity="0.7"/>
</svg>
